---
layout: default
---

<article class="post-page">

    <header class="post-header">

        <div class="blog-meta">
            {{ page.date | date: "%Y.%m.%d" }}
        </div>

        <h1>
            {{ page.title }}
        </h1>

    </header>


    <div class="post-content">

        {{ content }}

    </div>

</article>
