layout: default

<section class="project-page">


    <header class="project-header">


        <h1>
            {{ page.title }}
        </h1>


        {% if page.status %}

        <span class="project-status">
            {{ page.status }}
        </span>

        {% endif %}


    </header>



    <section class="project-content">


        {{ content }}


    </section>


</section>
