<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Jerry · 保持探索</title>
    <style>
        :root {
            --bg: #fafaf9;
            --text: #1c1c1e;
            --text-secondary: #515154;
            --text-tertiary: #86868b;
            --accent: #b0a092;
            --border: #e5e5e5;
            --font-stack: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: var(--font-stack);
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }

        .main {
            width: 100%;
            max-width: 480px;
            padding: 40px 24px 48px;
            display: flex;
            flex-direction: column;
            gap: 48px;
        }

        /* ---------- 头部区域 ---------- */
        .hero {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 16px;
            position: relative;
        }

        .hero-letter {
            font-size: clamp(96px, 20vw, 128px);
            font-weight: 700;
            line-height: 0.85;
            letter-spacing: -0.02em;
            color: var(--text);
            margin-bottom: 8px;
            opacity: 0;
            transform: translateY(18px);
        }

        .hero-letter.animate-hero {
            animation: fadeUpHero 0.75s cubic-bezier(0.33, 0.0, 0.2, 1.0) forwards;
        }

        @keyframes fadeUpHero {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero-name {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--text);
        }

        .hero-tag {
            font-size: 15px;
            font-weight: 450;
            color: var(--text-secondary);
            letter-spacing: 0.02em;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .hero-tag span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .dot-separator {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--accent);
            opacity: 0.6;
        }

        /* ---------- 格言与介绍组合区域 ---------- */
        .intro-group {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-top: -24px;
        }

        /* 签名格言 */
        .motto {
            font-size: 18px;
            font-weight: 500;
            color: var(--text);
            letter-spacing: -0.01em;
            line-height: 1.4;
            max-width: 280px;
            position: relative;
            padding-left: 0;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1), transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .motto.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .motto::before {
            content: '';
            position: absolute;
            left: -16px;
            top: 4px;
            bottom: 4px;
            width: 2px;
            background: var(--accent);
            opacity: 0.35;
            border-radius: 1px;
        }

        /* ---------- 关于我：分行杂志排版 ---------- */
        .about-lines {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 320px;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1), transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .about-lines.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .about-line {
            font-size: 15px;
            font-weight: 430;
            line-height: 1.65;
            letter-spacing: 0.01em;
            color: var(--text-secondary);
        }

        .about-line--strong {
            font-weight: 560;
            color: var(--text);
            font-size: 15px;
        }

        .about-line strong {
            color: var(--text);
            font-weight: 580;
        }

        /* ---------- 热爱之物：杂志目录风格 ---------- */
        .passions {
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        .passion-item {
            display: flex;
            align-items: baseline;
            gap: 16px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1), transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .passion-item.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .passion-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .passion-index {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-tertiary);
            min-width: 20px;
            letter-spacing: 0.04em;
        }

        .passion-emoji {
            font-size: 22px;
            opacity: 0.9;
        }

        .passion-content {
            flex: 1;
        }

        .passion-title {
            font-size: 17px;
            font-weight: 600;
            color: var(--text);
            letter-spacing: -0.01em;
            margin-bottom: 4px;
        }

        .passion-desc {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.5;
            letter-spacing: 0.01em;
        }

        /* ---------- 联系方式：创意错位排版 ---------- */
        .contact {
            display: flex;
            flex-direction: column;
            gap: 28px;
            margin-top: 8px;
        }

        .contact-item {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            text-decoration: none;
            color: var(--text);
            transition: opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1), transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
            opacity: 0;
            transform: translateY(10px);
        }

        .contact-item.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .contact-item:active {
            opacity: 0.65;
        }

        .contact-icon {
            font-size: 20px;
            width: 32px;
            text-align: left;
            flex-shrink: 0;
            opacity: 0.8;
        }

        .contact-detail {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .contact-label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-tertiary);
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .contact-value {
            font-size: 16px;
            font-weight: 500;
            color: var(--text);
            letter-spacing: -0.01em;
            word-break: break-all;
            position: relative;
        }

        .contact-value::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -2px;
            width: 100%;
            height: 1px;
            background: var(--accent);
            opacity: 0.25;
            transition: opacity 0.3s ease;
        }

        .contact-item:active .contact-value::after {
            opacity: 0;
        }

        /* ---------- 底部 ---------- */
        .footer {
            font-size: 12px;
            color: var(--text-tertiary);
            letter-spacing: 0.03em;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .back-to-top {
            color: var(--text-tertiary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .back-to-top:active {
            color: var(--text);
        }

        /* ========== 响应式微调 ========== */
        @media (max-width: 380px) {
            .main {
                padding: 32px 20px 40px;
                gap: 40px;
            }
            .hero-letter {
                font-size: 80px;
            }
            .motto {
                font-size: 16px;
                max-width: 240px;
            }
            .about-line,
            .about-line--strong {
                font-size: 14px;
            }
            .about-lines {
                max-width: 280px;
                gap: 8px;
            }
            .contact-value {
                font-size: 15px;
            }
            .passion-title {
                font-size: 16px;
            }
            .intro-group {
                gap: 14px;
                margin-top: -20px;
            }
        }
    </style>
</head>
<body>
    <div class="main" id="top">

        <!-- ========== 头部 ========== -->
        <header class="hero">
            <div class="hero-letter" id="heroLetter" aria-hidden="true">J</div>
            <h1 class="hero-name">Jerry</h1>
            <div class="hero-tag">
                <span>🧑‍🎓 高中生</span>
                <span class="dot-separator" aria-hidden="true"></span>
                <span>⚡ 科技爱好者</span>
            </div>
        </header>

        <!-- ========== 格言 + 关于我组合区域 ========== -->
        <div class="intro-group">
            <div class="motto" data-animate>
                保持探索
            </div>

            <div class="about-lines" data-animate>
                <p class="about-line about-line--strong">嘿，我是 Jerry。</p>
                <p class="about-line">一名生活在数字与魔法之间的高中生。</p>
                <p class="about-line">相信<strong>人工智能</strong>能改变世界，</p>
                <p class="about-line">也对<strong>哈利·波特</strong>的魔法保持心动。</p>
                <p class="about-line">不急着定义未来，</p>
                <p class="about-line">只想<strong>保持探索</strong>。</p>
            </div>
        </div>

        <!-- ========== 热爱之物 ========== -->
        <section class="passions" id="passionsSection" data-animate-group>
            <div class="passion-item" data-animate-child>
                <span class="passion-index">01</span>
                <span class="passion-emoji">🤖</span>
                <div class="passion-content">
                    <div class="passion-title">人工智能</div>
                    <p class="passion-desc">从大模型到生成式AI，好奇智能如何重塑世界。</p>
                </div>
            </div>
            <div class="passion-item" data-animate-child>
                <span class="passion-index">02</span>
                <span class="passion-emoji">🔭</span>
                <div class="passion-content">
                    <div class="passion-title">前沿科技</div>
                    <p class="passion-desc">关注硬件创新、太空探索与未来生活形态。</p>
                </div>
            </div>
            <div class="passion-item" data-animate-child>
                <span class="passion-index">03</span>
                <span class="passion-emoji">⚡</span>
                <div class="passion-content">
                    <div class="passion-title">哈利·波特</div>
                    <p class="passion-desc">霍格沃茨永远是我精神上的母校，魔法即想象。</p>
                </div>
            </div>
        </section>

        <!-- ========== 联系方式 ========== -->
        <section class="contact" id="contactSection" data-animate-group>
            <a href="mailto:3822423725@qq.com" class="contact-item" data-animate-child>
                <span class="contact-icon">📧</span>
                <div class="contact-detail">
                    <span class="contact-label">Email</span>
                    <span class="contact-value">3822423725@qq.com</span>
                </div>
            </a>
            <a href="https://github.com/Jerry-Future666" target="_blank" rel="noopener noreferrer" class="contact-item" data-animate-child>
                <span class="contact-icon">🐙</span>
                <div class="contact-detail">
                    <span class="contact-label">GitHub</span>
                    <span class="contact-value">Jerry-Future666</span>
                </div>
            </a>
        </section>

        <!-- ========== 底部 ========== -->
        <footer class="footer">
            <span>© 2026 Jerry</span>
            <a class="back-to-top" id="backToTop">
                ↑ 顶部
            </a>
        </footer>
    </div>

    <script>
        (function() {
            // 1. J 字母动画：仅首次加载播放一次
            const heroLetter = document.getElementById('heroLetter');
            let heroPlayed = false;
            const heroObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting && !heroPlayed) {
                        heroPlayed = true;
                        setTimeout(() => {
                            heroLetter.classList.add('animate-hero');
                        }, 300);
                        heroObserver.disconnect();
                    }
                });
            }, { threshold: 0.15 });
            heroObserver.observe(heroLetter);

            heroLetter.addEventListener('animationend', () => {
                heroLetter.style.opacity = '1';
                heroLetter.style.transform = 'translateY(0)';
                requestAnimationFrame(() => heroLetter.classList.remove('animate-hero'));
            });

            // 2. 单个元素动画（保持探索、关于我分行）：进入视口显现，离开完全隐藏
            const singleElements = document.querySelectorAll('[data-animate]');
            const singleObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const el = entry.target;
                    if (entry.isIntersecting) {
                        el.classList.add('visible');
                    } else {
                        el.classList.remove('visible');
                    }
                });
            }, { threshold: 0.25 });
            singleElements.forEach(el => singleObserver.observe(el));

            // 3. 分组动画（热爱之物、联系方式）：进入后子元素依次显现，离开全部隐藏
            const groupElements = document.querySelectorAll('[data-animate-group]');
            const groupTimers = new Map();

            const groupObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const group = entry.target;
                    const children = group.querySelectorAll('[data-animate-child]');

                    if (entry.isIntersecting) {
                        const timers = [];
                        children.forEach((child, index) => {
                            const timerId = setTimeout(() => {
                                child.classList.add('visible');
                            }, index * 120);
                            timers.push(timerId);
                        });
                        groupTimers.set(group, timers);
                    } else {
                        const timers = groupTimers.get(group) || [];
                        timers.forEach(timerId => clearTimeout(timerId));
                        groupTimers.delete(group);
                        children.forEach(child => {
                            child.classList.remove('visible');
                        });
                    }
                });
            }, { threshold: 0.15 });
            groupElements.forEach(group => groupObserver.observe(group));

            // 4. 回到顶部
            document.getElementById('backToTop').addEventListener('click', (e) => {
                e.preventDefault();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        })();
    </script>
</body>
</html>
